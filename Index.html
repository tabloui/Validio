<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación por Gmail · n8n</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f5f9ff 0%, #e6edf7 100%);
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            padding: 2.5rem 2.8rem;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.2rem;
        }

        h1 i {
            color: #1a73e8;
        }

        .subtitulo {
            font-size: 0.95rem;
            color: #3c5a7d;
            margin-bottom: 2rem;
            border-left: 4px solid #1a73e8;
            padding-left: 1rem;
            background: rgba(26, 115, 232, 0.04);
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
        }

        .campo label {
            font-weight: 500;
            color: #1e3a5f;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .campo label i {
            color: #1a73e8;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.5rem;
            border: 1px solid #dbe3ed;
            transition: all 0.25s;
        }

        .input-wrapper:focus-within {
            border-color: #1a73e8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
        }

        .input-wrapper input {
            border: none;
            background: transparent;
            padding: 0.9rem 0;
            font-size: 1rem;
            width: 100%;
            outline: none;
            color: #0b1e33;
        }

        .input-wrapper input::placeholder {
            color: #8fa0b9;
        }

        .input-wrapper .icon-email {
            color: #6d8bb0;
            font-size: 1.2rem;
        }

        .btn-enviar {
            background: #1a73e8;
            border: none;
            border-radius: 60px;
            padding: 0.9rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 18px -6px rgba(26, 115, 232, 0.3);
            margin-top: 0.5rem;
        }

        .btn-enviar:hover {
            background: #1557b0;
            transform: translateY(-2px);
        }

        .btn-enviar:active {
            transform: scale(0.97);
        }

        .btn-enviar:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .mensaje-area {
            margin-top: 1.8rem;
            padding: 0.8rem 1.2rem;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid transparent;
            transition: all 0.25s;
            min-height: 3.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.95rem;
        }

        .mensaje-area i {
            font-size: 1.3rem;
            width: 1.8rem;
            text-align: center;
        }

        .mensaje-area.info {
            background: #eef4fc;
            border-color: #c5d9f0;
            color: #1a3f66;
        }

        .mensaje-area.info i {
            color: #1a73e8;
        }

        .mensaje-area.success {
            background: #e6f6ed;
            border-color: #a8dcc4;
            color: #0e4d36;
        }

        .mensaje-area.success i {
            color: #1e9b6e;
        }

        .mensaje-area.error {
            background: #fdeeef;
            border-color: #f7c5c9;
            color: #9e2f3a;
        }

        .mensaje-area.error i {
            color: #d93c4c;
        }

        .mensaje-area.loading {
            background: #f0f3f8;
            border-color: #ccd9e8;
            color: #2b4d73;
        }

        .mensaje-area.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .webhook-info {
            margin-top: 1.8rem;
            padding-top: 1.2rem;
            border-top: 1px dashed #c9d8e9;
            font-size: 0.7rem;
            color: #5b7a9c;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 0.3rem;
        }

        .webhook-info span {
            background: rgba(0,0,0,0.02);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            word-break: break-all;
        }

        @media (max-width: 500px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>
        <i class="fas fa-envelope"></i> Gmail
    </h1>
    <div class="subtitulo">
        <i class="fas fa-shield-alt" style="margin-right: 8px; color:#1a73e8;"></i> 
        Envía código de verificación vía webhook n8n
    </div>

    <div class="campo">
        <label for="gmailInput">
            <i class="fas fa-at"></i> Correo electrónico
        </label>
        <div class="input-wrapper">
            <i class="fas fa-envelope icon-email"></i>
            <input 
                type="email" 
                id="gmailInput" 
                placeholder="tucorreo@gmail.com" 
                autocomplete="email"
            >
        </div>
    </div>

    <button class="btn-enviar" id="btnEnviarCodigo">
        <i class="fas fa-paper-plane"></i> Enviar código
    </button>

    <div id="mensajeArea" class="mensaje-area info">
        <i class="fas fa-info-circle"></i>
        <span id="mensajeTexto">Ingresa tu Gmail y presiona enviar</span>
    </div>

    <div class="webhook-info">
        <span><i class="fas fa-link"></i> n8n: hellomymodmd.app.n8n.cloud</span>
        <span><i class="fas fa-key"></i> API: 611589095</span>
    </div>
</div>

<script>
    (function() {
        // ============================================
        // 📌 CONFIGURACIÓN - CAMBIA ESTAS VARIABLES
        // ============================================
        const CONFIG = {
            // URL completa del webhook de n8n
            webhook_n8n_url: "https://hellomymodmd.app.n8n.cloud/webhook",
            
            // Tu API key
            api_key: "611589095",
            
            // Endpoints (no modificar a menos que cambien en n8n)
            endpoints: {
                enviar_codigo: "/verify/send",
                verificar_codigo: "/verify/check"
            }
        };
        // ============================================

        const URL_ENVIAR_CODIGO = CONFIG.webhook_n8n_url + CONFIG.endpoints.enviar_codigo;

        const gmailInput = document.getElementById('gmailInput');
        const btnEnviar = document.getElementById('btnEnviarCodigo');
        const mensajeArea = document.getElementById('mensajeArea');
        const mensajeTexto = document.getElementById('mensajeTexto');

        function setMensaje(tipo, texto, icono) {
            mensajeArea.className = 'mensaje-area ' + tipo;
            const iconElement = mensajeArea.querySelector('i');
            if (iconElement) {
                iconElement.className = icono || 
                    (tipo === 'info' ? 'fas fa-info-circle' :
                     tipo === 'success' ? 'fas fa-check-circle' :
                     tipo === 'error' ? 'fas fa-exclamation-circle' :
                     'fas fa-info-circle');
            }
            mensajeTexto.textContent = texto;
        }

        function habilitarBoton(habilitado) {
            btnEnviar.disabled = !habilitado;
            if (habilitado) {
                btnEnviar.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar código';
            } else {
                btnEnviar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            }
        }

        function esEmailValido(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        async function enviarCodigo() {
            const email = gmailInput.value.trim();

            if (!email) {
                setMensaje('error', 'Por favor, ingresa un correo electrónico.');
                return;
            }

            if (!esEmailValido(email)) {
                setMensaje('error', 'El formato del correo no es válido.');
                return;
            }

            setMensaje('loading', 'Enviando solicitud al webhook...');
            habilitarBoton(false);

            // 📌 PAYLOAD - Aquí puedes agregar más campos si tu webhook los requiere
            const payload = {
                email: email,
                api_key: CONFIG.api_key
                // Ejemplo: si necesitas más campos, agrégalos aquí:
                // nombre: "Usuario",
                // telefono: "123456789"
            };

            try {
                const response = await fetch(URL_ENVIAR_CODIGO, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                let respuestaData;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    respuestaData = await response.json();
                } else {
                    respuestaData = await response.text();
                }

                if (response.ok) {
                    let mensajeExito = 'Código enviado correctamente.';
                    if (typeof respuestaData === 'object' && respuestaData !== null) {
                        if (respuestaData.message) mensajeExito = respuestaData.message;
                        else if (respuestaData.msg) mensajeExito = respuestaData.msg;
                    } else if (typeof respuestaData === 'string' && respuestaData.length > 0) {
                        mensajeExito = respuestaData;
                    }
                    setMensaje('success', mensajeExito);
                } else {
                    let mensajeError = 'Error al enviar el código.';
                    if (typeof respuestaData === 'object' && respuestaData !== null) {
                        if (respuestaData.error) mensajeError = respuestaData.error;
                        else if (respuestaData.message) mensajeError = respuestaData.message;
                    } else if (typeof respuestaData === 'string' && respuestaData.length > 0) {
                        mensajeError = respuestaData;
                    }
                    setMensaje('error', `Error ${response.status}: ${mensajeError}`);
                }
            } catch (error) {
                console.error('Fetch error:', error);
                setMensaje('error', 'Error de conexión. Revisa tu red o el webhook.');
            } finally {
                habilitarBoton(true);
            }
        }

        btnEnviar.addEventListener('click', enviarCodigo);

        gmailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                enviarCodigo();
            }
        });

        gmailInput.addEventListener('input', () => {
            if (!mensajeArea.classList.contains('loading') && !btnEnviar.disabled) {
                setMensaje('info', 'Ingresa tu Gmail y presiona Enviar');
            }
        });

        setMensaje('info', 'Ingresa tu Gmail y presiona Enviar');
        habilitarBoton(true);

        console.log('📬 Webhook n8n para enviar código:', URL_ENVIAR_CODIGO);
    })();
</script>

</body>
</html>
